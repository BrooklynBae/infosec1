
name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: mvn -B -ntp -s .github/maven-settings.xml -DskipTests package

      - name: SAST - SpotBugs
        run: mvn -B -ntp -s .github/maven-settings.xml spotbugs:check

      - name: SCA - OWASP Dependency Check
        if: ${{ !cancelled() }}
        run: mvn -B -ntp -s .github/maven-settings.xml -DossIndexAnalyzerEnabled=false dependency-check:check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/reports/spotbugs.html
            target/dependency-check-report.html
          if-no-files-found: warn
